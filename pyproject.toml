[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videonotes-local"
version = "0.1.0.dev1"
description = "Local-first Video Notes Windows transcription prototype"
readme = "README.md"
requires-python = ">=3.10"
# No third-party runtime Python dependencies. The owner must decide the project's license.

[project.scripts]
videonotes = "videonotes.cli:main"

[tool.setuptools.packages.find]
include = ["videonotes*"]

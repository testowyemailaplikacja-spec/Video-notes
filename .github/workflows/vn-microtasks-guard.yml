name: KWN microtasks and acceptance integrity
on:
  pull_request:
    branches: [develop]
    paths:
      - 'docs/VN_MICROTASKS.json'
      - 'docs/VN_STATUS.json'
      - 'scripts/check_vn_microtasks.py'
      - 'tests/test_microtasks.py'
      - '.github/workflows/vn-microtasks-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan-integrity:
    name: Read-only KWN plan and stage consistency
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate microtasks and stage ledger without changing status
        run: python scripts/check_vn_microtasks.py
      - name: Regression tests for dependencies, missing evidence and false DONE
        run: python -m unittest tests.test_microtasks -v

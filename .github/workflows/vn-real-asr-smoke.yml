name: Video Notes — true local whisper.cpp inference on original synthetic speech
on:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/real_asr_smoke.py'
      - 'videonotes/study_guide.py'
      - 'videonotes/advanced_notes.py'
      - 'videonotes/docx_export.py'
      - 'scripts/real_obs_multitrack_asr_smoke.py'
      - 'scripts/real_resume_asr_smoke.py'
      - 'videonotes/asr.py'
      - 'videonotes/pipeline.py'
      - '.github/workflows/vn-real-asr-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-whisper-cpu:
    name: Real whisper.cpp multilingual tiny CPU PL/EN (synthetic TTS only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WHISPER_SHA: 6a8addd258eadd6563f8c582e8acc535e6325364
      WHISPER_MODEL_SHA256: be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Provide local build, FFmpeg and synthetic TTS tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v espeak-ng >/dev/null || ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 240s sudo apt-get update -qq
            timeout 300s sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
          fi
          cmake --version | head -n 1
          espeak-ng --version
          ffmpeg -version | head -n 1
      - name: Fetch and build pinned upstream whisper.cpp without GPU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whisper-cpp"
          git -C "$RUNNER_TEMP/whisper-cpp" init -q
          git -C "$RUNNER_TEMP/whisper-cpp" remote add origin https://github.com/ggml-org/whisper.cpp.git
          timeout 240s git -C "$RUNNER_TEMP/whisper-cpp" fetch --depth 1 origin "$WHISPER_SHA"
          git -C "$RUNNER_TEMP/whisper-cpp" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/whisper-cpp" rev-parse HEAD)" = "$WHISPER_SHA"
          git -C "$RUNNER_TEMP/whisper-cpp" submodule update --init --recursive --depth 1
          cmake -S "$RUNNER_TEMP/whisper-cpp" -B "$RUNNER_TEMP/whisper-cpp/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/whisper-cpp/build" --parallel 2 --target whisper-cli
          test -x "$RUNNER_TEMP/whisper-cpp/build/bin/whisper-cli"
      - name: Download and SHA-256 verify one MIT multilingual model (ephemeral CI only)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 30 --max-time 240 \
            --output "$RUNNER_TEMP/ggml-tiny.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "$WHISPER_MODEL_SHA256  $RUNNER_TEMP/ggml-tiny.bin" | sha256sum -c -
      - name: Generate original Polish and English voice clips offline
        shell: bash
        run: |
          set -euo pipefail
          espeak-ng -v pl -s 120 -w "$RUNNER_TEMP/pl.wav" 'To jest test nagrania wykładu. Router przekazuje pakiety pomiędzy sieciami. Program zamienia mowę na lokalną transkrypcję.'
          espeak-ng -v en -s 120 -w "$RUNNER_TEMP/en.wav" 'Hello. This is an offline audio test. A router connects two networks. The program converts speech to a local transcript.'
          test -s "$RUNNER_TEMP/pl.wav"
          test -s "$RUNNER_TEMP/en.wav"
      - name: Execute real CPU inference, timestamp checkpoints, exports and DOCX
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.real_asr_smoke \
            --whisper "$RUNNER_TEMP/whisper-cpp/build/bin/whisper-cli" \
            --model "$RUNNER_TEMP/ggml-tiny.bin" \
            --pl "$RUNNER_TEMP/pl.wav" --en "$RUNNER_TEMP/en.wav"
      - name: Real Whisper CPU on original two-track OBS-like MP4 and MKV
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.real_obs_multitrack_asr_smoke \
            --whisper "$RUNNER_TEMP/whisper-cpp/build/bin/whisper-cli" \
            --model "$RUNNER_TEMP/ggml-tiny.bin" \
            --pl "$RUNNER_TEMP/pl.wav" --en "$RUNNER_TEMP/en.wav"
      - name: Real Whisper checkpoint cancellation and resume on 34s two-track OBS-like MKV
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.real_resume_asr_smoke \
            --whisper "$RUNNER_TEMP/whisper-cpp/build/bin/whisper-cli" \
            --model "$RUNNER_TEMP/ggml-tiny.bin" \
            --pl "$RUNNER_TEMP/pl.wav"
      - name: Install optional CTranslate2 inference and memory measurement (CI only)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'faster-whisper==1.2.1' 'av==18.1.0' 'psutil>=6,<8'
      - name: Obtain verified multilingual faster-whisper tiny CTranslate2 model
        shell: bash
        run: |
          set -euo pipefail
          HF_REV=d90ca5fe260221311c53c58e660288d3deb8d356
          MODEL_DIR="$RUNNER_TEMP/faster-tiny"
          mkdir -p "$MODEL_DIR"
          for name in model.bin config.json tokenizer.json vocabulary.txt; do
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
              --connect-timeout 30 --max-time 240 \
              --output "$MODEL_DIR/$name" \
              "https://huggingface.co/Systran/faster-whisper-tiny/resolve/$HF_REV/$name"
          done
          echo "dcb76c6586fc06cbdac6dd21f14cfd129cc4cdd9dce19bf4ffa62e59cbe6e6d1  $MODEL_DIR/model.bin" | sha256sum -c -
          test -s "$MODEL_DIR/config.json"
          test -s "$MODEL_DIR/tokenizer.json"
          test -s "$MODEL_DIR/vocabulary.txt"
      - name: Diagnose optional CPU inference with synthetic audio only, redacting transcript and paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          try:
              import faster_whisper
              from faster_whisper import WhisperModel
              import av
              assert av.__version__.split(".")[0] == "18"
              print("faster-whisper module import: OK, pinned PyAV 18")
              model = WhisperModel(str(Path(os.environ["RUNNER_TEMP"]) / "faster-tiny"),
                                   device="cpu", compute_type="int8", cpu_threads=4,
                                   num_workers=1, local_files_only=True)
              print("faster-whisper model initialization: OK")
              segments, info = model.transcribe(str(Path(os.environ["RUNNER_TEMP"]) / "pl.wav"),
                                                language="pl", beam_size=5,
                                                vad_filter=False, condition_on_previous_text=True)
              count = sum(1 for part in segments if part.text.strip())
              print("faster-whisper synthetic PL inference segments:", count)
              if count < 1:
                  raise RuntimeError("Empty synthetic TTS result")
          except Exception as error:
              detail = str(error).replace(os.environ["RUNNER_TEMP"], "<ephemeral-runner>")
              print("faster-whisper failed with class", type(error).__name__, "synthetic model error:", detail[:500])
              # Error is from an ephemeral downloaded model and original TTS, never private user audio.
              raise SystemExit(2)
          PY
      - name: Compare two real local CPU engines on exactly the same PL and EN TTS WAV
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'To jest test nagrania wykładu. Router przekazuje pakiety pomiędzy sieciami. Program zamienia mowę na lokalną transkrypcję.' > "$RUNNER_TEMP/reference-pl.txt"
          printf '%s\n' 'Hello. This is an offline audio test. A router connects two networks. The program converts speech to a local transcript.' > "$RUNNER_TEMP/reference-en.txt"
          for language in pl en; do
            python -m videonotes benchmark-real "$RUNNER_TEMP/$language.wav" \
              --reference "$RUNNER_TEMP/reference-$language.txt" \
              --cpp-executable "$RUNNER_TEMP/whisper-cpp/build/bin/whisper-cli" \
              --cpp-model "$RUNNER_TEMP/ggml-tiny.bin" \
              --faster-model-dir "$RUNNER_TEMP/faster-tiny" \
              --language "$language" --threads 4 --duration-seconds 30 \
              --output "$RUNNER_TEMP/bench-$language.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for language in ("pl", "en"):
              report = json.loads((root / f"bench-{language}.json").read_text("utf-8"))
              assert report["local_subprocesses_executed"] is True
              assert report["engine_binary_identity_independently_verified"] is False
              assert len(report["accuracy"]) == 2
              assert {row["label_supplied_by_user"] for row in report["accuracy"]} == {"whisper_cpp", "faster_whisper"}
              assert all(row["reference_words"] > 5 for row in report["accuracy"])
              assert all(row["wer"] >= 0 for row in report["accuracy"])
              for label in ("whisper_cpp", "faster_whisper"):
                  timing = report["timing_and_memory"][label]
                  assert timing["wall_seconds"] > 0
                  assert timing["ram_measured"] is True and timing["peak_rss_bytes"] > 0
          print("Real two-engine PL/EN benchmark completed; WER/CER and RSS verified in ephemeral JSON.")
          PY

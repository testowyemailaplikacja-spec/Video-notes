name: Video Notes — source, FFmpeg and source-only notes
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'videonotes/**'
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/vn00-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-linux:
    name: Python stdlib and real FFmpeg synthetic media (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify local FFmpeg tooling (bounded install only if absent)
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 240s sudo apt-get update -qq
            timeout 300s sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run all tests
        run: |
          python -m compileall -q videonotes tests
          python -m unittest discover -s tests -v
      - name: Confirm CLI responds without remote services
        run: python -m videonotes --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser transcript contract without npm dependencies
        run: |
          node --check web/transcript-core.js
          node --check web/app.js
          node --test tests/web-core.test.cjs tests/web-controller.test.cjs
  unit-windows:
    name: Python stdlib contracts on Windows (not full Windows acceptance)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify interpreter and core contracts without external ASR
        shell: pwsh
        run: |
          python -m compileall -q videonotes tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_contracts tests.test_asr tests.test_notes tests.test_advanced_notes tests.test_microphone tests.test_bundle tests.test_quality tests.test_notes_cli tests.test_backup tests.test_backup_cli tests.test_note_revisions tests.test_note_revisions_cli tests.test_asr_lab tests.test_asr_lab_cli tests.test_windows_console tests.test_lock_recovery tests.test_pipeline_long tests.test_note_selection tests.test_pdf_export tests.test_study_guide tests.test_audio_diagnostics tests.test_mic_real_ffmpeg_pause tests.test_recovery_audio -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m videonotes --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser transcript contract without npm dependencies
        run: |
          node --check web/transcript-core.js
          node --check web/app.js
          node --test tests/web-core.test.cjs tests/web-controller.test.cjs

  browser-chromium-linux:
    name: Real Chromium file:// browser smoke (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate preinstalled Chromium or Chrome
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null; then
            echo "CHROME_BIN=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          else
            echo "No preinstalled headless browser found on runner" >&2
            exit 1
          fi
      - name: Launch real local KWN page and exercise import/edit/export
        run: |
          node --check scripts/browser-smoke.cjs
          node scripts/browser-smoke.cjs

  browser-windows:
    name: Real Chrome and Edge file:// browser smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Launch local KWN in Chrome and Edge without network dependencies
        shell: pwsh
        run: |
          node --check scripts/browser-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidates = @(
            @{ Name = "Chrome"; Paths = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
            ) },
            @{ Name = "Edge"; Paths = @(
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
            ) }
          )
          foreach ($browser in $candidates) {
            $exe = $browser.Paths | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $exe) {
              Write-Error "Preinstalled $($browser.Name) not found"
              exit 1
            }
            Write-Host "Browser smoke: $($browser.Name)"
            $env:CHROME_BIN = $exe
            node scripts/browser-smoke.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  browser-firefox-linux:
    name: Real Firefox file:// browser smoke (Linux WebDriver)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Firefox and geckodriver
        shell: bash
        run: |
          firefox --version
          if command -v geckodriver >/dev/null; then
            echo "GECKODRIVER_BIN=$(command -v geckodriver)" >> "$GITHUB_ENV"
          elif [ -x "$GECKOWEBDRIVER/geckodriver" ]; then
            echo "GECKODRIVER_BIN=$GECKOWEBDRIVER/geckodriver" >> "$GITHUB_ENV"
          else
            echo "No geckodriver on Ubuntu runner" >&2
            exit 1
          fi
      - name: Exercise local KWN import/edit/50k/focus with Firefox WebDriver
        run: |
          node --check scripts/browser-smoke.cjs
          node --check scripts/firefox-smoke.cjs
          node scripts/firefox-smoke.cjs

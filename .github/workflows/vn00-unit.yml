name: Video Notes — source, FFmpeg and source-only notes
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'videonotes/**'
      - 'web/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/vn00-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-linux:
    name: Python stdlib and real FFmpeg synthetic media (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify local FFmpeg tooling (bounded install only if absent)
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 240s sudo apt-get update -qq
            timeout 300s sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run all tests
        run: |
          python -m compileall -q videonotes tests
          python -m unittest discover -s tests -v
      - name: Confirm CLI responds without remote services
        run: python -m videonotes --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser transcript contract without npm dependencies
        run: |
          node --check web/transcript-core.js
          node --check web/app.js
          node --test tests/web-core.test.cjs tests/web-controller.test.cjs
  unit-windows:
    name: Python stdlib contracts on Windows (not full Windows acceptance)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify interpreter and core contracts without external ASR
        shell: pwsh
        run: |
          python -m compileall -q videonotes tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_contracts tests.test_asr tests.test_notes tests.test_advanced_notes tests.test_microphone tests.test_bundle tests.test_quality tests.test_notes_cli tests.test_backup tests.test_backup_cli tests.test_note_revisions tests.test_note_revisions_cli tests.test_asr_lab tests.test_asr_lab_cli tests.test_windows_console tests.test_lock_recovery -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m videonotes --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser transcript contract without npm dependencies
        run: |
          node --check web/transcript-core.js
          node --check web/app.js
          node --test tests/web-core.test.cjs tests/web-controller.test.cjs
